<style id="main-css">
/* ============================================================
   THREE DIMOS — Design tokens + base
   Sleek cinematic dark, vibrant gradient accents, big grotesk
   ============================================================ */

:root{
  /* fonts (overridden by tweak font pairing) */
  --font-display: "Schibsted Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, monospace;

  /* accent palette (overridden by tweak) */
  --a1: #f05a28;
  --a2: #0ea5a4;
  --a3: #ffd166;
  --grad: linear-gradient(110deg, var(--a1), var(--a3));

  /* geometry */
  --radius: 16px;
  --maxw: 1280px;
  --gutter: clamp(20px, 5vw, 64px);

  /* motion (0..1.4) drives JS + css easing presence */
  --motion: 1;

  color-scheme: dark;
}

/* ---- THEME: dark (default) ---- */
[data-theme="dark"]{
  --bg: #07070c;
  --bg-2: #0b0b13;
  --panel: rgba(255,255,255,.035);
  --panel-2: rgba(255,255,255,.06);
  --fg: #f3f2f8;
  --fg-dim: rgba(243,242,248,.78);
  --fg-faint: rgba(243,242,248,.72);
  --line: rgba(255,255,255,.10);
  --line-2: rgba(255,255,255,.16);
  --on-accent: #08080d;
  --glow: .55;
}

/* ---- THEME: light ---- */
[data-theme="light"]{
  --bg: #f3f2f0;
  --bg-2: #ffffff;
  --panel: rgba(10,10,18,.025);
  --panel-2: rgba(10,10,18,.05);
  --fg: #0c0c14;
  --fg-dim: rgba(12,12,20,.76);
  --fg-faint: rgba(12,12,20,.82);
  --line: rgba(10,10,20,.12);
  --line-2: rgba(10,10,20,.2);
  --on-accent: #ffffff;
  --glow: .22;
  color-scheme: light;
}

*{ box-sizing: border-box; }

html{ scroll-behavior: smooth; }

body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

::selection{ background: var(--a1); color: #fff; }

a{ color: inherit; text-decoration: none; }
button{ font-family: inherit; }

/* ---------- shared type ---------- */
.eyebrow{
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--fg-faint);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before{
  content:"";
  width: 22px; height: 1px;
  background: var(--grad);
}

h1,h2,h3{
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.98;
  margin: 0;
  text-wrap: balance;
}
h3{ line-height: 1.1; }

p{ text-wrap: pretty; }

/* ---------- layout ---------- */
.wrap{
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding-inline: var(--gutter);
}

section{ position: relative; }

.section-pad{ padding-block: clamp(72px, 11vw, 160px); }

/* ---------- buttons ---------- */
.btn{
  --bh: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: var(--bh);
  padding: 0 26px;
  border-radius: calc(var(--radius) * 0.7);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15.5px;
  letter-spacing: -0.01em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, background .25s, border-color .25s, opacity .25s;
  white-space: nowrap;
}
.btn:active{ transform: translateY(1px) scale(.99); }

.btn-primary{
  color: var(--on-accent);
  background: var(--grad);
  background-size: 160% 160%;
}
.btn-primary:hover{
  transform: translateY(-2px);
  filter: brightness(1.08);
  animation: gradShift 4s ease infinite;
}
@keyframes gradShift{
  0%,100%{ background-position: 0% 50%; }
  50%{ background-position: 100% 50%; }
}

.btn-ghost{
  color: var(--fg);
  background: var(--panel);
  border-color: var(--line-2);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.btn-ghost:hover{
  background: var(--panel-2);
  border-color: var(--fg-faint);
  transform: translateY(-2px);
}

.btn-arrow{ transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.btn:hover .btn-arrow{ transform: translate(3px,-3px); }

/* ---------- pill / tag ---------- */
.tag{
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: .04em;
  color: var(--fg-dim);
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position: fixed; inset: 0 0 auto 0;
  z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px var(--gutter);
  transition: background .4s, backdrop-filter .4s, border-color .4s;
  border-bottom: 1px solid transparent;
}
.nav.scrolled{
  background: color-mix(in oklab, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom-color: var(--line);
  padding-block: 10px;
}
.brand{
  display: flex; align-items: center; gap: 13px;
  cursor: pointer; text-decoration:none;
}
/* ---- isometric cube logo (renders everywhere) ---- */
.td-cube{ width: 36px; height: 36px; flex:none; }
.td-cube-svg{ width: 100%; height: 100%; overflow: visible; display:block; }
.td-cube-g{
  transform-box: fill-box; transform-origin: center;
  transition: transform .3s cubic-bezier(.2,.8,.2,1);
  animation: cubeBob 6s ease-in-out infinite;
}
.brand:hover .td-cube-g{ animation: none; }
.td-cube polygon{ stroke: rgba(255,255,255,.16); stroke-width: 1; stroke-linejoin: round;
  transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.cf-top{   fill: color-mix(in oklab, var(--a2) 86%, #fff); }
.cf-left{  fill: var(--a1); }
.cf-right{ fill: color-mix(in oklab, var(--a3) 80%, #000); }
.brand:hover .cf-top{   transform: translateY(-3px); }
.brand:hover .cf-left{  transform: translate(-2.5px, 1.4px); }
.brand:hover .cf-right{ transform: translate(2.5px, 1.4px); }
@keyframes cubeBob{
  0%,100%{ transform: translateY(0) rotate(0deg); }
  50%{ transform: translateY(-2px) rotate(-4deg); }
}
.foot-cube{ width: 56px; height: 56px; display:block; margin-bottom: 22px; }
.td-word{
  font-family: var(--font-display);
  font-weight: 800; letter-spacing: -0.045em;
  line-height: 1; font-size: 22px; display:flex;
}
.td-word .td-three{ color: var(--fg); }
.td-word .td-dimos{
  color: var(--a1);
}


.nav-links{
  display: flex; align-items: center; gap: 4px;
}
.nav-link{
  font-size: 14.5px; font-weight: 500;
  color: var(--fg-dim);
  padding: 9px 14px; border-radius: 9px;
  transition: color .2s, background .2s;
}
.nav-link:hover{ color: var(--fg); background: var(--panel); }
.nav-cta{ margin-left: 8px; }
.nav.menu-open{
  background: var(--bg) !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  border-bottom-color: var(--line) !important;
}
.nav-burger{
  display: none;
  align-items: center; justify-content: center;
  width: 40px; height: 40px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  color: var(--fg);
  cursor: pointer;
  flex-shrink: 0;
  transition: background .2s, border-color .2s;
}
.nav-burger:hover{ background: var(--panel-2); border-color: var(--fg-faint); }

/* Full-screen mobile menu rendered inside the nav when open */
.mobile-menu{
  position: fixed; inset: 0;
  z-index: 99;
  background: var(--bg);
  display: flex; flex-direction: column;
  padding: 80px var(--gutter) var(--gutter);
  overflow-y: auto;
  animation: menuIn .32s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes menuIn{
  from{ opacity:0; transform:translateY(-12px); }
  to{   opacity:1; transform:translateY(0); }
}
.mobile-nav-links{ display:flex; flex-direction:column; flex:1; }
.mobile-nav-link{
  font-family: var(--font-display);
  font-size: clamp(32px, 9vw, 52px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--fg);
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
  display: block;
  transition: color .2s;
}
.mobile-nav-link:hover{ color: var(--a1); }
.mobile-cta{
  margin-top: 32px;
  width: 100%;
  height: 56px !important;
  font-size: 16px !important;
}

@media (max-width: 880px){
  .nav-links .nav-link{ display:none; }
  .nav-burger{ display:flex; }
}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position: relative;
  min-height: 100svh;
  display: flex;
  isolation: isolate;
  clip-path: inset(0);
}
#orb-canvas{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: -1;
}
/* vignette + grain over the canvas */
.hero::after{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(125% 85% at 50% -5%, transparent 38%, color-mix(in oklab, var(--bg) 82%, transparent) 100%),
    linear-gradient(to bottom, transparent 80%, color-mix(in oklab, var(--bg) 88%, transparent) 100%);
}

.hero-inner{
  width: 100%; max-width: var(--maxw);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-top: 96px;
  display: flex;
  align-items: center;
}

.hero-availability{
  display:inline-flex; align-items:center; gap:9px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing:.01em;
  color: var(--fg-dim);
  padding: 7px 14px; border:1px solid var(--line); border-radius:999px;
  background: color-mix(in oklab, var(--bg) 55%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.dot-live{
  width:7px;height:7px;border-radius:50%;background:#37e39b;
  box-shadow:0 0 0 0 rgba(55,227,155,.6);
  animation: pulse 2.4s infinite;
}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(55,227,155,.55);}
  70%{ box-shadow:0 0 0 8px rgba(55,227,155,0);}
  100%{ box-shadow:0 0 0 0 rgba(55,227,155,0);}
}

.hero-title{
  font-size: clamp(56px, 10vw, 96px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.9;
}
.hero-title .l{ display:block; }

.hero-sub{
  color: var(--fg-dim);
  font-size: clamp(17px, 2vw, 21px);
  max-width: 30ch;
  line-height: 1.5;
}
.hero-cta{ display:flex; flex-wrap:wrap; gap: 14px; }

.hero-meta{
  display:flex; gap: 26px; flex-wrap:wrap;
  color: var(--fg-faint);
  font-family: var(--font-mono); font-size: 12px; letter-spacing:.04em;
}
.hero-meta b{ color: var(--fg); font-weight:600; }

/* --- variant: CENTERED --- */
.hero[data-variant="centered"] .hero-inner{ justify-content:center; }
.hero[data-variant="centered"] .hero-content{
  text-align:center; display:flex; flex-direction:column; align-items:center;
  gap: 30px; max-width: 1000px; position:relative;
}
.hero[data-variant="centered"] .hero-content::before{
  content:""; position:absolute; z-index:-1;
  inset: -16% -10%;
  background: radial-gradient(52% 46% at 50% 50%, color-mix(in oklab, var(--bg) 62%, transparent) 0%, transparent 72%);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.hero[data-variant="centered"] .hero-sub{ max-width: 46ch; }
.hero[data-variant="centered"] .hero-meta{ justify-content:center; }

/* --- variant: SPLIT --- */
.hero[data-variant="split"] .hero-inner{ justify-content:flex-start; }
.hero[data-variant="split"] .hero-content{
  display:flex; flex-direction:column; align-items:flex-start; gap: 28px;
  max-width: 640px;
}
.hero[data-variant="split"] .hero-title{ font-size: clamp(52px, 7.5vw, 96px); }
.hero[data-variant="split"] #orb-canvas{
  left: 38%;
}
.hero[data-variant="split"]::before{
  content:""; position:absolute; inset:0 0 0 44%; z-index:-1; pointer-events:none;
  background: radial-gradient(60% 60% at 70% 50%, transparent 40%, color-mix(in oklab,var(--bg) 70%, transparent) 100%);
}

/* --- variant: KINETIC --- */
.hero[data-variant="kinetic"]{ align-items:flex-end; }
.hero[data-variant="kinetic"] .hero-inner{
  flex-direction:column; align-items:stretch; justify-content:flex-end;
  padding-bottom: clamp(48px, 7vw, 90px);
}
.hero[data-variant="kinetic"] #orb-canvas{ top:-8%; }
.hero[data-variant="kinetic"] .hero-content{ display:contents; }
.kinetic-row{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap: 30px; flex-wrap: wrap;
}
.hero[data-variant="kinetic"] .hero-sub{ max-width: 34ch; }
.kinetic-marquee{
  margin: 18px 0 26px;
  overflow:clip; width:100%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.kinetic-track{
  display:inline-flex; gap: 0; white-space:nowrap;
  animation: marq 24s linear infinite;
  animation-duration: calc(24s / max(var(--motion), .15));
  will-change: transform;
}
.kinetic-track span{
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(60px, 12.5vw, 190px); letter-spacing:-0.04em;
  line-height: .9; padding-right: .35em;
}
.kinetic-track .o{
  color: transparent;
  -webkit-text-stroke: 1.4px var(--fg-faint);
}
.kinetic-track .f{ color: var(--a1); }
@keyframes marq{ to{ transform: translateX(-50%); } }

.hero[data-variant="kinetic"] .hero-content{ }
.hero-content.kinetic-only{ display:none; }
.hero[data-variant="kinetic"] .hero-content.standard{ display:none; }
.hero[data-variant="kinetic"] .hero-content.kinetic-only{ display:block; width:100%; }

@media (max-width: 760px){
  .hero[data-variant="split"] #orb-canvas{ left:0; opacity:.7; }
  .kinetic-row{ flex-direction:column; align-items:flex-start; }
}

/* scroll hint */
.scroll-hint{
  position:absolute; left:50%; bottom: 26px; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.04em;
  color: var(--fg-faint); z-index:2;
}
.scroll-hint .bar{ width:1px; height:34px; background:linear-gradient(var(--fg-faint), transparent); animation: drop 2s infinite; }
@keyframes drop{ 0%{transform:scaleY(0);transform-origin:top;} 45%{transform:scaleY(1);transform-origin:top;} 55%{transform:scaleY(1);transform-origin:bottom;} 100%{transform:scaleY(0);transform-origin:bottom;} }

/* reef interaction hint */
.hero-hint{
  position:absolute; left:var(--gutter); bottom: 24px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.02em;
  color: var(--fg-faint); white-space:nowrap; z-index:2; pointer-events:none;
  padding:7px 14px; border:1px solid var(--line); border-radius:999px;
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display:flex; align-items:center; gap:9px;
  opacity:0; animation: hintFade 15s ease-in-out 1.5s forwards;
}
.hero-hint::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--grad); flex:none; }
@keyframes hintFade{ 0%{opacity:0; transform:translateY(6px);} 7%{opacity:1; transform:translateY(0);} 88%{opacity:1;} 100%{opacity:0; transform:translateY(4px);} }
@media (max-width:640px){ .hero-hint{ display:none; } }

/* ============================================================
   TRUST STRIP
   ============================================================ */
.trust{
  border-block: 1px solid var(--line);
  padding-block: 30px;
  background: var(--bg-2);
}
.trust-inner{ display:flex; align-items:center; gap: clamp(28px,5vw,64px); flex-wrap:wrap; justify-content:space-between; }
.trust-label{ font-family:var(--font-mono); font-size:12px; letter-spacing:.02em; color:var(--fg-faint); max-width:32ch; }
.trust-logos{ display:flex; align-items:center; gap: clamp(26px,4vw,52px); flex-wrap:wrap; }
.logo-ph{
  height: 26px; min-width: 96px;
  display:flex; align-items:center; justify-content:center;
  color: var(--fg-faint); font-family:var(--font-display); font-weight:700; letter-spacing:-.02em;
  font-size: 17px; opacity:.62; transition: opacity .3s, color .3s;
}
.logo-ph:hover{ opacity:1; color: var(--fg); }

/* ============================================================
   SECTION HEADER
   ============================================================ */
.sec-head{ display:flex; flex-direction:column; gap:20px; max-width: 760px; margin-bottom: 56px; }
.sec-title{ font-size: clamp(34px, 5.2vw, 64px); font-weight:700; }
.sec-lead{ color: var(--fg-dim); font-size: clamp(17px,1.6vw,20px); max-width: 56ch; }
.sec-head.split{ flex-direction:row; align-items:flex-end; justify-content:space-between; max-width:none; gap:40px; flex-wrap:wrap; }

/* ============================================================
   SERVICES
   ============================================================ */
.services{ background: var(--bg); }
.svc-grid{
  display:grid; grid-template-columns: repeat(12, 1fr); gap: 18px;
}
.svc-card{
  grid-column: span 6;
  position:relative; overflow:clip;
  border:1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--panel), transparent);
  padding: clamp(26px, 3vw, 40px);
  min-height: 280px;
  display:flex; flex-direction:column;
  transition: transform .5s cubic-bezier(.2,.8,.2,1), border-color .4s, background .4s;
}
.svc-card:hover{ transform: translateY(-4px); border-color: var(--line-2); }
.svc-card::before{
  content:""; position:absolute; inset:0; opacity:0; transition:opacity .5s; pointer-events:none;
  background: radial-gradient(80% 100% at var(--mx,50%) 0%, color-mix(in oklab, var(--a1) 22%, transparent), transparent 60%);
}
.svc-card:hover::before{ opacity:1; }
.svc-ico{
  width: 46px; height:46px; border-radius: 12px; flex:none;
  display:grid; place-items:center;
  background: var(--panel-2); border:1px solid var(--line);
  color: var(--fg);
}
.svc-ico svg{ width:22px; height:22px; }
.svc-card h3{ font-size: clamp(20px, 2.2vw, 27px); margin:0; }
.svc-tagline{ color:var(--fg); font-weight:600; font-size:15px; margin-bottom:14px; font-family:var(--font-display); letter-spacing:-.01em; }
.svc-desc{ color: var(--fg-dim); font-size: 15.5px; margin: 0 0 22px; }
.svc-tags{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }
.svc-head-row{ display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; }

@media (max-width: 820px){ .svc-card{ grid-column: span 12; min-height:0; } }

/* ============================================================
   PILLARS  (Design / Code / Motion)
   ============================================================ */
.pillars{ background: var(--bg-2); border-block:1px solid var(--line); }
.pillar-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:clip; }
.pillar{
  padding: clamp(30px,3.4vw,48px);
  border-right:1px solid var(--line);
  position:relative; cursor:default;
  transition: background .4s;
  min-height: 240px; display:flex; flex-direction:column; gap:16px;
}
.pillar:last-child{ border-right:0; }
.pillar:hover{ background: var(--panel); }
.pillar h3{ font-size: clamp(30px,3.6vw,46px); margin: 0; }
.pillar h3 .num{ display:block; font-size:14px; color:var(--fg-faint); font-family:var(--font-mono); letter-spacing:.1em; font-weight:400; -webkit-text-fill-color: currentColor; margin-bottom:18px; }
.pillar p{ color:var(--fg-dim); font-size:15.5px; margin:0; }
.pillar .barfill{ height:3px; width:46px; background:var(--grad); border-radius:2px; margin-bottom:20px; transform-origin:left center; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
.pillar:hover .barfill{ transform: scaleX(2.17); }
@media (max-width: 820px){ .pillar-grid{ grid-template-columns:1fr; } .pillar{ border-right:0; border-bottom:1px solid var(--line); min-height:0; } .pillar:last-child{border-bottom:0;} }

/* ============================================================
   WORK
   ============================================================ */
.work{ background: var(--bg); }
.work-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 20px; }
.work-card{
  position:relative; border:1px solid var(--line); border-radius:var(--radius);
  overflow:clip; background: var(--bg-2);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), border-color .4s;
  cursor:pointer;
}
.work-card:hover{ transform: translateY(-5px); border-color: var(--line-2); }
.work-card.big{ grid-column: span 2; }
.work-thumb{
  position:relative; aspect-ratio: 16/10; overflow:clip;
  background: radial-gradient(ellipse at 28% 32%, color-mix(in oklab, var(--a1) 20%, var(--bg-2)), var(--bg-2) 72%);
}
.work-card.big .work-thumb{ aspect-ratio: 21/8; }
.work-thumb::after{
  content: attr(data-ph);
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.05em;
  color: var(--fg-faint);
}
.work-thumb::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(60% 80% at 30% 0%, color-mix(in oklab,var(--a2) 26%, transparent), transparent 55%);
  opacity:0; transition:opacity .5s;
}
.work-card:hover .work-thumb::after{ opacity:1; }
.work-meta{ display:flex; justify-content:space-between; align-items:center; padding: 20px 22px; gap:16px; }
.work-meta h3{ font-size: clamp(20px,2vw,26px); font-weight:700; }
.work-note{ margin:8px 0 0; color:var(--fg-dim); font-size:14px; line-height:1.4; max-width:38ch; }
.work-arrow{ width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2); display:grid;place-items:center; flex:none; transition: background .3s, color .3s, transform .4s; }
.work-card:hover .work-arrow{ background:var(--grad); color:var(--on-accent); border-color:transparent; transform: rotate(-45deg); }
@media (max-width: 760px){ .work-grid{ grid-template-columns:1fr; } .work-card.big{ grid-column:span 1; } }

/* ============================================================
   PROCESS
   ============================================================ */
.process{ background: var(--bg-2); border-block:1px solid var(--line); }
.proc-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap: 0; }
.proc-step{ padding: 34px 26px 34px 0; border-top:1px solid var(--line-2); position:relative; }
.proc-step h3{ font-size: clamp(21px,2.2vw,27px); margin: 14px 0 10px; }
.proc-step p{ color:var(--fg-dim); font-size:14.5px; margin:0; max-width: 26ch; }
.proc-step::before{ content:""; position:absolute; top:-1px; left:0; width:46px; height:3px; background:var(--grad); }
@media (max-width: 880px){ .proc-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width: 520px){ .proc-grid{ grid-template-columns:1fr; } }

/* ============================================================
   CTA
   ============================================================ */
.cta{ position:relative; overflow:clip; background: var(--bg); }
.cta-card{
  position:relative; overflow:clip;
  border:1px solid var(--line-2); border-radius: calc(var(--radius) * 1.4);
  padding: clamp(48px, 7vw, 110px) clamp(28px,5vw,80px);
  text-align:center;
  background:
    radial-gradient(120% 140% at 50% -20%, color-mix(in oklab, var(--a1) 26%, transparent), transparent 60%),
    var(--bg-2);
}
.cta-card::after{
  content:""; position:absolute; left:50%; bottom:-60%; width:120%; aspect-ratio:1; transform:translateX(-50%);
  background: radial-gradient(circle, color-mix(in oklab, var(--a2) 22%, transparent), transparent 60%);
  filter: blur(30px); opacity: var(--glow); pointer-events:none;
}
.cta-card h2{ font-size: clamp(38px, 6.4vw, 92px); font-weight:800; letter-spacing:-0.045em; margin-bottom: 22px; position:relative; }
.cta-card p{ color:var(--fg-dim); font-size: clamp(17px,1.8vw,21px); max-width: 50ch; margin: 0 auto 38px; position:relative; }
.cta-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; position:relative; }

/* ============================================================
   FOOTER
   ============================================================ */
.footer{ background: var(--bg); border-top:1px solid var(--line); padding-block: 64px 40px; }
.foot-top{ display:flex; justify-content:space-between; gap: 48px; flex-wrap:wrap; margin-bottom: 56px; }
.foot-brand{ max-width: 360px; }
.foot-word{ font-family:var(--font-display); font-weight:800; letter-spacing:-0.05em; line-height:.82; text-transform:uppercase; font-size: clamp(46px,7vw,86px); margin-bottom:20px; }
.foot-word span{ display:block; }
.foot-word span:last-child{ color: var(--a1); }
.foot-tag{ font-family:var(--font-mono); font-size:13px; letter-spacing:.03em; color:var(--fg-dim); }
.foot-cols{ display:flex; gap: clamp(36px,5vw,72px); flex-wrap:wrap; }
.foot-col h3{ font-family:var(--font-mono); font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-faint); margin:0 0 16px; font-weight:500; }
.foot-col a{ display:block; color:var(--fg-dim); font-size:14.5px; padding:5px 0; transition:color .2s; }
.foot-col a:hover{ color:var(--fg); }
.foot-bottom{ display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; padding-top:28px; border-top:1px solid var(--line); color:var(--fg-faint); font-size:13px; font-family:var(--font-mono); letter-spacing:.01em; }

/* ============================================================
   REVEAL animation — hidden only once .js-reveal is confirmed
   (progressive enhancement: content visible if JS fails/slow)
   ============================================================ */
.js-reveal [data-reveal]{ opacity:0; transform: translateY(26px); }
.js-reveal [data-reveal].in{ opacity:1; transform:none; transition: opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
[data-motion="0"] [data-reveal]{ opacity:1 !important; transform:none !important; transition:none !important; }
@media (prefers-reduced-motion: reduce){
  .js-reveal [data-reveal]{ opacity:1 !important; transform:none !important; }
  .kinetic-track, .dot-live, .scroll-hint .bar{ animation:none !important; }
  .mobile-menu{ animation:none !important; }
}

</style>
</head>
